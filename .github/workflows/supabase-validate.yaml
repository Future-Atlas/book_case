name: Validate Supabase Migrations

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-*.yaml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Flutter Web
        run: flutter build web

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify required DB files
        run: |
          test -f supabase/config.toml
          test -f supabase/seed.sql

      - name: Start local Supabase services
        run: supabase start

      - name: Reset local DB with migrations and seed
        run: supabase db reset

      - name: Stop local Supabase services
        if: always()
        run: supabase stop
