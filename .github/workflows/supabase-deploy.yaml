name: Deploy Database to Supabase

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
                uses: actions/checkout@v4

            - name: Setup Supabase CLI
                uses: supabase/setup-cli@v1
                with:
                    version: latest

            - name: Verify required DB files
                run: |
                    test -f supabase/config.toml
                    test -f supabase/seed.sql

            - name: Validate migration plan
                run: |
                    supabase link --project-ref "$SUPABASE_PROJECT_ID" -p "$SUPABASE_DB_PASSWORD"
                    supabase db push --dry-run
                env:
                    SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
                    SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
                    SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

            - name: Deploy database migrations
                run: |
                    supabase link --project-ref "$SUPABASE_PROJECT_ID" -p "$SUPABASE_DB_PASSWORD"
                    supabase db push
                env:
                    SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
                    SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
                    SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

            - name: Deploy security edge function
                run: |
                    supabase functions deploy session-guard --project-ref "$SUPABASE_PROJECT_ID"
                env:
                    SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
                    SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
