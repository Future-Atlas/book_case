    <script>
      (() => {
        const allowedPath = /^\/(?:$|genre\/(?:recommended|western|popular))$/;
        const adClient = "ca-pub-3052085512168272";
        const adScriptUrl =
          "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=" +
          adClient;

        let adScriptLoaded = false;

        function hasMeaningfulContent() {
          const text = (document.body ? document.body.innerText : "")
            .replace(/\s+/g, " ")
            .trim();
          if (text.length < 120) return false;
          return /(Sharemarium|おすすめの本|洋書|人気作品)/.test(text);
        }

        function shouldLoadAds() {
          const pathname =
            (window.location.pathname || "/").replace(/\/+$/, "") || "/";
          return (
            allowedPath.test(pathname) &&
            hasMeaningfulContent() &&
            window.__sharemariumAdsAllowed !== false
          );
        }

        function loadAdsIfAllowed() {
          if (!shouldLoadAds() || adScriptLoaded) {
            return;
          }

          adScriptLoaded = true;
          const script = document.createElement("script");
          script.async = true;
          script.src = adScriptUrl;
          script.crossOrigin = "anonymous";
          script.dataset.adsense = "1";
          document.head.appendChild(script);
        }

        if (!shouldLoadAds()) {
          return;
        }

        loadAdsIfAllowed();
        window.addEventListener("popstate", loadAdsIfAllowed, {
          passive: true,
        });

        const originalPushState = window.history.pushState;
        const originalReplaceState = window.history.replaceState;

        window.history.pushState = function (...args) {
          const result = originalPushState.apply(this, args);
          loadAdsIfAllowed();
          return result;
        };

        window.history.replaceState = function (...args) {
          const result = originalReplaceState.apply(this, args);
          loadAdsIfAllowed();
          return result;
        };
      })();
    </script>
